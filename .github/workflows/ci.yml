name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy + lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.75
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Cargo.lock is up-to-date
        run: cargo metadata --locked --format-version 1 > cargo-metadata.json

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [unit, contract, integration]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.75

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests (${{ matrix.group }})
        run: cargo nextest run --workspace -E 'binary_id(/${{ matrix.group }}/)'
        timeout-minutes: 20

  smoke:
    name: ${{ matrix.os }} / smoke
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.75

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Smoke (60s)
        env:
          AICORE_SMOKE_SECONDS: "60"
        run: cargo nextest run --workspace -E 'binary_id(/smoke/)'
        timeout-minutes: 10
  windows-production:
    name: windows-production
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.75
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Windows smoke
        shell: pwsh
        run: ./deploy/windows/ci/windows-smoke.ps1

      - name: Installer assets check
        run: cargo nextest run -p aicore-tests --test installer_windows_e2e
