name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"  # 每日 03:00 UTC
  workflow_dispatch:

jobs:
  long-run:
    name: long-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.75

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Long run (1h)
        env:
          AICORE_LONG_RUN_SECONDS: "3600"
        run: cargo nextest run -p aicore-tests --test stability_long_run_integration
        timeout-minutes: 90

      - name: L0 real workload
        run: cargo nextest run -p aicore-tests --test l0_real_workload_e2e

      - name: Windows service smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/windows/ci/windows-smoke.ps1


      - name: Bench baseline
        shell: bash
        run: |
          cargo build -p aicore-bench
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./target/debug/aicore-bench.exe --ticks 1000 --output benchmarks/v3.2-nightly-${RUNNER_OS}.json
          else
            ./target/debug/aicore-bench --ticks 1000 --output benchmarks/v3.2-nightly-${RUNNER_OS}.json
          fi
          cat benchmarks/v3.2-nightly-${RUNNER_OS}.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-${{ github.run_id }}
          path: benchmarks/v3.2-nightly-*.json
