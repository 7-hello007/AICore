# AICore rustfmt 配置
#
# 只使用 rustfmt stable 选项。
# 原因：本项目的 rust-toolchain.toml 锁定 Rust 1.75（stable），
# CI 使用 dtolnay/rust-toolchain@1.75。
#
# 以下选项在 rustfmt 1.7.0-stable 上是 unstable，本仓库不使用：
#   - imports_granularity
#   - group_imports
#   - wrap_comments
#   - comment_width
#   - format_strings
#   - normalize_comments
#   - blank_lines_upper_bound
#   - blank_lines_lower_bound
#
# 在 stable 上使用会打出 warning 并被静默忽略。
# 详见 docs/decisions/ADR-004-rustfmt-policy.md。

edition = "2021"
max_width = 100

# 字段初始化简写：Foo { x, y } 而非 Foo { x: x, y: y }
use_field_init_shorthand = true

# 使用 `?` 而非手写 match
use_try_shorthand = true

# 跨平台统一 LF
newline_style = "Unix"

# 显式声明空格缩进
hard_tabs = false
tab_spaces = 4

# import 与 mod 声明排序
reorder_imports = true
reorder_modules = true

# match arm 尾逗号（stable）
match_block_trailing_comma = true

# 合并相邻的 #[derive]
merge_derives = true