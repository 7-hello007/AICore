# AICore rustfmt configuration
#
# Use only rustfmt stable options.
# Reason: The rust-toolchain.toml locks Rust 1.75 (stable) on this project.
# CI uses dtolnay/rust-toolchain@1.75.
#
# The following options are not used in this repository:
#   - imports_granularity
#   - group_imports
#   - wrap_comments
#   - comment_width
#   - format_strings
#   - normalize_comments
#   - blank_lines_upper_bound
#   - blank_lines_lower_bound
#
# Using these options on stable Rust would emit warnings or ignore them.
# This file defines formatting policy directly and does not reuse architecture ADR numbers.

edition = "2021"
max_width = 100

# Initialize fields as `Foo { x, y }` instead of `Foo { x: x, y: y }`.
use_field_init_shorthand = true

# Use `?` instead of a handwritten forwarding match.
use_try_shorthand = true

# Use LF consistently across platforms.
newline_style = "Unix"

# Use spaces for indentation.
hard_tabs = false
tab_spaces = 4

# Ordering
reorder_imports = true
reorder_modules = true

# Add trailing commas to block-style match arms.
match_block_trailing_comma = true

# Merge adjacent `#[derive]` attributes.
merge_derives = true
