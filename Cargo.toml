[workspace]
resolver = "2"
members = [
    "contracts",
    "core",
    "runtime",
    "runtime-router",
    "service-host",
    "examples/plugin-hello",
    "examples/plugin-echo",
    "adapters/windows",
    "adapters/linux",
    "ai",
    "ai-runtime",
    "memory",
    "api",
    "ipc",
    "plugin",
    "tier",
    "tier-l0",
    "tier-l1",
    "tier-l2",
    "task-runtime",
    "tests",
    "apps/aicored",
    "apps/aicore-cli",
    "apps/aicore-bench",
    "apps/aicore-dashboard",
    "apps/aicore-dashboard-web",
    "apps/aicore-l0-realworld",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"
authors = ["AICore Team"]

[workspace.dependencies]
rayon-core = "=1.12.1"
rayon = "=1.9.0"
memchr = "=2.7.4"
zeroize = "=1.8.2"
base64ct = "=1.6.0"
rand = "0.8"
hex = "0.4"
ed25519-dalek = { version = "=2.0.0", default-features = false, features = ["std"] }
sha2 = "0.10"
libloading = "0.8"
async-trait = "0.1"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.132"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }