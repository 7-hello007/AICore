[package]
name = "aicore-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aicore-contracts = { path = "../contracts" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libloading.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true

[dev-dependencies]
rand.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
