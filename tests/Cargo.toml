[package]
name = "aicore-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

autotests = false
autobins = false
autoexamples = false
autobenches = false

[dependencies]
aicore-contracts = { path = "../contracts" }
aicore-core = { path = "../core" }
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
